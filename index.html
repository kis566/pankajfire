<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Code Beat DJ 🎧</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: 'Trebuchet MS', system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  #stage {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at bottom, #2a0044, #000);
    overflow: hidden;
  }

  /* HUD */
  .hud {
    position: absolute;
    top: 10px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 100;
    pointer-events: none;
  }
  .pill {
    background: rgba(0,0,0,0.7);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
    margin: 0 3px;
  }
  .pill.score { border-color: #ffeb3b; color: #ffeb3b; }
  .pill.combo { border-color: #ff4081; color: #ff4081; }
  .pill.song { border-color: #00e5ff; color: #00e5ff; }
  .hud-left, .hud-right { display: flex; align-items: center; }

  /* Hit line */
  .hitLine {
    position: absolute;
    left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, #fff, #ffeb3b, #fff, transparent);
    box-shadow: 0 0 20px #ffeb3b, 0 0 40px rgba(255,235,59,0.5);
    z-index: 5;
    pointer-events: none;
  }

  /* Lane hints */
  .laneHint {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 14px;
    border: 3px solid;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: rgba(255,255,255,0.05);
    transition: transform 0.08s, background 0.08s;
    z-index: 6;
    pointer-events: none;
  }
  .laneHint[data-lane="0"] { border-color: #00e5ff; color: #00e5ff; box-shadow: 0 0 20px rgba(0,229,255,0.5); }
  .laneHint[data-lane="1"] { border-color: #ff4081; color: #ff4081; box-shadow: 0 0 20px rgba(255,64,129,0.5); }
  .laneHint[data-lane="2"] { border-color: #ffeb3b; color: #ffeb3b; box-shadow: 0 0 20px rgba(255,235,59,0.5); }
  .laneHint[data-lane="3"] { border-color: #4caf50; color: #4caf50; box-shadow: 0 0 20px rgba(76,175,80,0.5); }
  .laneHint.hit {
    background: rgba(255,255,255,0.4);
    transform: scale(1.15);
  }

  /* Note */
  .note {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    z-index: 8;
    will-change: transform;
    pointer-events: none;
  }
  .note[data-lane="0"] { background: linear-gradient(135deg, #00e5ff, #0097a7); color: #000; box-shadow: 0 0 25px #00e5ff; }
  .note[data-lane="1"] { background: linear-gradient(135deg, #ff4081, #c2185b); color: #fff; box-shadow: 0 0 25px #ff4081; }
  .note[data-lane="2"] { background: linear-gradient(135deg, #ffeb3b, #fbc02d); color: #000; box-shadow: 0 0 25px #ffeb3b; }
  .note[data-lane="3"] { background: linear-gradient(135deg, #4caf50, #2e7d32); color: #fff; box-shadow: 0 0 25px #4caf50; }

  /* FX */
  .popup {
    position: absolute;
    font-size: 18px;
    font-weight: 900;
    pointer-events: none;
    z-index: 50;
    text-shadow: 0 0 12px currentColor;
    animation: popRise 0.7s ease-out forwards;
    white-space: nowrap;
    transform: translate(-50%, 0);
  }
  @keyframes popRise {
    0% { opacity: 0; transform: translate(-50%, 20px) scale(0.5); }
    25% { opacity: 1; transform: translate(-50%, 0) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
  }

  .spark {
    position: absolute;
    width: 80px; height: 80px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 40;
    transform: translate(-50%, -50%);
    animation: sparkPop 0.5s ease-out forwards;
  }
  @keyframes sparkPop {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
  }

  /* Big combo */
  #comboBig {
    position: absolute;
    top: 35%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 56px;
    font-weight: 900;
    color: #ff4081;
    text-shadow: 0 0 20px #ff4081, 0 0 40px #ff4081;
    z-index: 60;
    pointer-events: none;
    font-family: 'Arial Black', sans-serif;
    letter-spacing: -2px;
  }
  #comboBig.show { animation: comboPop 0.7s ease-out; }
  @keyframes comboPop {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  /* Mobile controls */
  #mobileControls {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 6px;
    z-index: 90;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
  }
  .mBtn {
    padding: 18px 0;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    color: #fff;
    font-size: 26px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .mBtn:active { background: rgba(255,255,255,0.4); }
  .mBtn[data-lane="0"] { border-color: #00e5ff; }
  .mBtn[data-lane="1"] { border-color: #ff4081; }
  .mBtn[data-lane="2"] { border-color: #ffeb3b; }
  .mBtn[data-lane="3"] { border-color: #4caf50; }

  @media (min-width: 768px) {
    #mobileControls { display: none; }
  }

  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(26,0,51,0.97), rgba(0,0,0,0.99));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    z-index: 200;
    gap: 16px;
  }
  .overlay.hide { display: none; }

  .logo {
    font-size: 38px;
    font-weight: 900;
    background: linear-gradient(90deg, #00e5ff, #ff4081, #ffeb3b, #4caf50, #00e5ff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 3s linear infinite;
    letter-spacing: 2px;
  }
  @keyframes rainbow { to { background-position: 300% 0; } }

  .subtitle { font-size: 12px; letter-spacing: 3px; color: #ffeb3b; }
  .desc { font-size: 14px; color: #ccc; max-width: 400px; line-height: 1.6; }

  .keys {
    display: flex;
    gap: 12px;
    margin: 8px 0;
  }
  .key {
    background: rgba(0,0,0,0.5);
    border: 2px solid #ff4081;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 22px;
    box-shadow: 0 0 15px rgba(255,64,129,0.5);
  }

  .playBtn {
    padding: 16px 44px;
    background: linear-gradient(135deg, #ff4081, #c2185b);
    border: none;
    border-radius: 15px;
    color: white;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.4), 0 0 40px rgba(255,64,129,0.6);
    letter-spacing: 2px;
    font-family: inherit;
    animation: pulse 1.5s infinite;
    transition: transform 0.1s;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .playBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }

  .ytBtn {
    background: #ff0000;
    color: white;
    padding: 10px 22px;
    border-radius: 25px;
    font-size: 13px;
    font-weight: bold;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 0 20px rgba(255,0,0,0.5);
  }

  .stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 10px 0;
  }
  .stat {
    background: rgba(0,0,0,0.6);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 10px 18px;
    min-width: 90px;
  }
  .stat .val { font-size: 24px; font-weight: 900; color: #ffeb3b; }
  .stat .lbl { font-size: 10px; color: #aaa; letter-spacing: 1px; margin-top: 2px; }

  .rank {
    font-size: 64px;
    margin: 8px 0;
    animation: rankPop 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  }
  @keyframes rankPop {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }

  #countdown {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 150;
    font-size: 140px;
    font-weight: 900;
    color: #ffeb3b;
    text-shadow: 0 0 40px #ffeb3b, 0 0 80px #ff9800;
    font-family: 'Arial Black', sans-serif;
    pointer-events: none;
  }
  #countdown.show { display: flex; }
  #countdown.pop { animation: countPop 0.6s ease-out; }
  @keyframes countPop {
    0% { transform: scale(2); opacity: 0; }
    40% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.6); opacity: 0; }
  }

  #progressBar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 4px;
    width: 0%;
    background: linear-gradient(90deg, #00e5ff, #ff4081, #ffeb3b);
    box-shadow: 0 0 15px rgba(255,64,129,0.8);
    z-index: 80;
    transition: width 0.2s linear;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="stage">
  <div class="hud">
    <div class="hud-left">
      <div class="pill song" id="songPill">🎵 Ready</div>
    </div>
    <div class="hud-right">
      <div class="pill combo" id="comboPill">🔥 0</div>
      <div class="pill score" id="scorePill">🏆 0</div>
    </div>
  </div>

  <div class="hitLine" id="hitLine"></div>

  <div class="laneHint" data-lane="0">⬅️</div>
  <div class="laneHint" data-lane="1">⬆️</div>
  <div class="laneHint" data-lane="2">⬇️</div>
  <div class="laneHint" data-lane="3">➡️</div>

  <div id="comboBig"></div>
  <div id="countdown"></div>
  <div id="progressBar"></div>

  <div id="mobileControls">
    <div class="mBtn" data-lane="0">⬅️</div>
    <div class="mBtn" data-lane="1">⬆️</div>
    <div class="mBtn" data-lane="2">⬇️</div>
    <div class="mBtn" data-lane="3">➡️</div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="logo">CODE BEAT DJ</div>
    <div class="subtitle">BY CODESHALABYKMFL</div>
    <div class="desc">
      Notes girti hain — sahi time pe <b>arrow keys</b> dabao!<br>
      Perfect timing = <b>PERFECT! + 300 points</b>
    </div>
    <div class="keys">
      <div class="key">⬅️</div>
      <div class="key">⬆️</div>
      <div class="key">⬇️</div>
      <div class="key">➡️</div>
    </div>
    <button class="playBtn" id="playBtn">▶ PLAY</button>
    <a class="ytBtn" href="https://youtube.com/@codeshalabykmfl" target="_blank">▶ CodeShalaByKMFL</a>
  </div>

  <div class="overlay hide" id="endScreen">
    <div class="logo" id="endTitle">SONG COMPLETE!</div>
    <div class="rank" id="rankEmoji">🏆</div>
    <div class="stats">
      <div class="stat"><div class="val" id="finalScore">0</div><div class="lbl">SCORE</div></div>
      <div class="stat"><div class="val" id="finalCombo">0</div><div class="lbl">MAX COMBO</div></div>
      <div class="stat"><div class="val" id="finalAcc">0%</div><div class="lbl">ACCURACY</div></div>
    </div>
    <div class="desc" id="rankText"></div>
    <button class="playBtn" id="playAgainBtn">🔄 PLAY AGAIN</button>
    <a class="ytBtn" href="https://youtube.com/@codeshalabykmfl" target="_blank">▶ Aur Coding Seekho</a>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ============ CONFIG ============
  const TRAVEL_TIME = 1800;      // ms for a note to fall
  const PERFECT_MS = 100;
  const GOOD_MS = 200;
  const OK_MS = 320;
  const NOTE_SIZE = 60;

  // ============ DOM ============
  const stage = document.getElementById('stage');
  const hitLine = document.getElementById('hitLine');
  const comboBig = document.getElementById('comboBig');
  const countdownEl = document.getElementById('countdown');
  const progressBar = document.getElementById('progressBar');
  const songPill = document.getElementById('songPill');
  const comboPill = document.getElementById('comboPill');
  const scorePill = document.getElementById('scorePill');
  const startScreen = document.getElementById('startScreen');
  const endScreen = document.getElementById('endScreen');
  const laneHints = [
    document.querySelector('.laneHint[data-lane="0"]'),
    document.querySelector('.laneHint[data-lane="1"]'),
    document.querySelector('.laneHint[data-lane="2"]'),
    document.querySelector('.laneHint[data-lane="3"]')
  ];
  const mBtns = document.querySelectorAll('.mBtn');

  // ============ STATE ============
  const state = {
    running: false,
    startTime: 0,
    notes: [],       // all notes with hitTime, lane, hit, missed
    activeNotes: [], // notes with DOM elements
    score: 0,
    combo: 0,
    maxCombo: 0,
    perfect: 0,
    good: 0,
    ok: 0,
    miss: 0,
    lastFrame: 0,
    songIdx: 0,
    animId: null
  };

  // ============ LAYOUT CALC ============
  function getLaneCenterX(lane) {
    const w = stage.clientWidth;
    const laneW = NOTE_SIZE;
    const gap = Math.min(20, w / 30);
    const totalW = laneW * 4 + gap * 3;
    const startX = (w - totalW) / 2;
    return startX + lane * (laneW + gap) + laneW / 2;
  }

  function getHitLineY() {
    return stage.clientHeight * 0.72;
  }

  function positionStatic() {
    const hy = getHitLineY();
    hitLine.style.top = hy + 'px';

    // Lane hints below hit line
    for (let i = 0; i < 4; i++) {
      const x = getLaneCenterX(i);
      const hint = laneHints[i];
      hint.style.left = (x - NOTE_SIZE/2) + 'px';
      hint.style.top = (hy + 20) + 'px';
    }
  }

  // ============ AUDIO ============
  let audioCtx = null;
  let masterGain = null;
  let musicTimer = null;

  function initAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(audioCtx.destination);
    } catch(e) {
      audioCtx = null;
    }
  }

  function playTone(freq, dur, type, vol) {
    if (!audioCtx || !masterGain) return;
    type = type || 'sine';
    vol = vol || 0.15;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(g);
    g.connect(masterGain);
    const t = audioCtx.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }

  function sfxHit() { playTone(660 + Math.random()*200, 0.1, 'triangle', 0.18); }
  function sfxPerfect() { playTone(1047, 0.1, 'sine', 0.2); setTimeout(function(){ playTone(1319, 0.12, 'sine', 0.18); }, 60); }
  function sfxMiss() { playTone(140, 0.18, 'sawtooth', 0.12); }
  function sfxCombo() { playTone(880, 0.08, 'square', 0.1); }
  function sfxClick() { playTone(880, 0.05, 'square', 0.1); }

  // Music sequencer
  const BASS_NOTES = [65.41, 65.41, 55, 55, 43.65, 43.65, 49, 49]; // C2 C2 A1 A1 F1 F1 G1 G1
  let musicStep = 0;
  function startMusic(bpm) {
    if (musicTimer) clearInterval(musicTimer);
    const beatMs = 60000 / bpm;
    musicStep = 0;
    musicTimer = setInterval(function() {
      if (!state.running) return;
      // Kick on every beat
      playTone(60, 0.12, 'sine', 0.25);
      // Hi-hat every half beat
      playTone(6000 + Math.random()*1000, 0.02, 'square', 0.04);
      // Bass every 2 beats
      if (musicStep % 2 === 0) {
        const bassIdx = Math.floor(musicStep / 2) % BASS_NOTES.length;
        playTone(BASS_NOTES[bassIdx], beatMs/1000 * 0.9, 'triangle', 0.18);
      }
      musicStep++;
    }, beatMs / 2);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  // ============ SONG PATTERNS ============
  // [lane, beatTime]
  const SONGS = [
    {
      name: 'Warmup Beat',
      bpm: 100,
      notes: [
        [0, 2], [1, 4], [2, 6], [3, 8],
        [0, 10], [1, 12], [2, 14], [3, 16],
        [3, 18], [2, 20], [1, 22], [0, 24],
        [0, 26], [1, 27], [2, 28], [3, 29],
        [0, 30], [1, 31], [2, 32], [3, 33]
      ]
    },
    {
      name: 'Hacker Mode',
      bpm: 120,
      notes: [
        [0, 2], [1, 3], [2, 4], [3, 5],
        [0, 6], [1, 7], [2, 8], [3, 9],
        [3, 10], [2, 11], [1, 12], [0, 13],
        [0, 14], [0, 15], [2, 16], [3, 17],
        [1, 18], [1, 19], [2, 20], [3, 21],
        [0, 22], [3, 23], [1, 24], [2, 25],
        [0, 27], [1, 28], [2, 29], [3, 30],
        [0, 32], [1, 33], [2, 34], [3, 35]
      ]
    },
    {
      name: 'MEGA MIX',
      bpm: 135,
      notes: [
        [0, 2], [1, 2.5], [2, 3], [3, 3.5],
        [3, 4], [2, 4.5], [1, 5], [0, 5.5],
        [0, 6], [2, 6.5], [1, 7], [3, 7.5],
        [0, 8], [1, 8.5], [2, 9], [3, 9.5],
        [3, 10], [0, 10.5], [1, 11], [2, 11.5],
        [2, 12], [1, 12.5], [0, 13], [3, 13.5],
        [0, 14], [0, 14.5], [0, 15], [0, 15.5],
        [1, 16], [1, 16.5], [2, 17], [3, 17.5],
        [0, 18], [1, 18.5], [2, 19], [3, 19.5],
        [3, 20], [2, 20.5], [1, 21], [0, 21.5],
        [0, 22], [1, 22.5], [2, 23], [3, 23.5]
      ]
    }
  ];

  // ============ GAME FLOW ============
  function startGame() {
    initAudio();
    sfxClick();
    startScreen.classList.add('hide');
    endScreen.classList.add('hide');

    resetState();
    positionStatic();

    // Countdown 3, 2, 1, GO
    showCountdown(function() {
      actuallyStart();
    });
  }

  function resetState() {
    state.running = false;
    state.score = 0;
    state.combo = 0;
    state.maxCombo = 0;
    state.perfect = 0;
    state.good = 0;
    state.ok = 0;
    state.miss = 0;
    state.notes = [];
    state.activeNotes = [];

    // Remove all note elements
    document.querySelectorAll('.note').forEach(function(n){ n.remove(); });
    document.querySelectorAll('.popup').forEach(function(n){ n.remove(); });
    document.querySelectorAll('.spark').forEach(function(n){ n.remove(); });

    comboBig.classList.remove('show');
    progressBar.style.width = '0%';
    updateHUD();
  }

  function showCountdown(cb) {
    countdownEl.classList.add('show');
    let n = 3;
    countdownEl.textContent = n;
    countdownEl.classList.remove('pop');
    void countdownEl.offsetWidth;
    countdownEl.classList.add('pop');
    playTone(440, 0.15, 'square', 0.15);

    const iv = setInterval(function() {
      n--;
      if (n > 0) {
        countdownEl.textContent = n;
        countdownEl.classList.remove('pop');
        void countdownEl.offsetWidth;
        countdownEl.classList.add('pop');
        playTone(440 + (3 - n) * 80, 0.15, 'square', 0.15);
      } else if (n === 0) {
        countdownEl.textContent = 'GO!';
        countdownEl.classList.remove('pop');
        void countdownEl.offsetWidth;
        countdownEl.classList.add('pop');
        playTone(880, 0.3, 'square', 0.2);
      } else {
        clearInterval(iv);
        countdownEl.classList.remove('show');
        cb();
      }
    }, 650);
  }

  function actuallyStart() {
    state.running = true;
    state.startTime = performance.now();
    state.lastFrame = state.startTime;

    const song = SONGS[state.songIdx % SONGS.length];
    const beatMs = 60000 / song.bpm;
    songPill.textContent = '🎵 ' + song.name;

    state.notes = song.notes.map(function(arr) {
      return {
        lane: arr[0],
        hitTime: arr[1] * beatMs,
        spawned: false,
        hit: false,
        missed: false,
        el: null
      };
    });

    // Song end time
    const lastNoteTime = state.notes.length > 0
      ? Math.max.apply(null, state.notes.map(function(n){ return n.hitTime; }))
      : 0;
    state.songDuration = lastNoteTime + 1500;

    startMusic(song.bpm);
    state.animId = requestAnimationFrame(gameLoop);
  }

  // ============ GAME LOOP ============
  function gameLoop(now) {
    if (!state.running) return;

    const elapsed = now - state.startTime;

    // Spawn notes
    for (let i = 0; i < state.notes.length; i++) {
      const n = state.notes[i];
      if (!n.spawned && elapsed >= n.hitTime - TRAVEL_TIME) {
        n.spawned = true;
        spawnNote(n);
      }
    }

    // Update note positions
    const hy = getHitLineY();
    for (let i = 0; i < state.activeNotes.length; i++) {
      const n = state.activeNotes[i];
      if (n.hit || n.missed || !n.el) continue;

      const t = (elapsed - (n.hitTime - TRAVEL_TIME)) / TRAVEL_TIME;
      const y = -NOTE_SIZE + t * (hy + NOTE_SIZE);
      n.el.style.transform = 'translateY(' + y + 'px)';

      // Auto-miss if too late
      if (t > 1 && (elapsed - n.hitTime) > OK_MS) {
        n.missed = true;
        handleMiss(n);
      }
    }

    // Progress bar
    if (state.songDuration) {
      const pct = Math.min(100, (elapsed / state.songDuration) * 100);
      progressBar.style.width = pct + '%';
    }

    // End?
    if (elapsed > state.songDuration) {
      endSong();
      return;
    }

    state.animId = requestAnimationFrame(gameLoop);
  }

  function spawnNote(n) {
    const el = document.createElement('div');
    el.className = 'note';
    el.dataset.lane = n.lane;
    const icons = ['⬅️', '⬆️', '⬇️', '➡️'];
    el.textContent = icons[n.lane];
    const cx = getLaneCenterX(n.lane);
    el.style.left = (cx - NOTE_SIZE/2) + 'px';
    el.style.top = '0px';
    el.style.transform = 'translateY(' + (-NOTE_SIZE) + 'px)';
    stage.appendChild(el);
    n.el = el;
    state.activeNotes.push(n);
  }

  // ============ INPUT ============
  const KEY_MAP = {
    'ArrowLeft': 0, 'ArrowUp': 1, 'ArrowDown': 2, 'ArrowRight': 3,
    'a': 0, 'A': 0,
    'w': 1, 'W': 1,
    's': 2, 'S': 2,
    'd': 3, 'D': 3
  };

  document.addEventListener('keydown', function(e) {
    if (!state.running) return;
    const lane = KEY_MAP[e.key];
    if (lane !== undefined) {
      e.preventDefault();
      hitLane(lane);
    }
  });

  // Mobile buttons
  for (let i = 0; i < mBtns.length; i++) {
    (function(btn) {
      const lane = parseInt(btn.dataset.lane);
      btn.addEventListener('touchstart', function(e) {
        e.preventDefault();
        if (state.running) hitLane(lane);
      }, { passive: false });
      btn.addEventListener('mousedown', function(e) {
        e.preventDefault();
        if (state.running) hitLane(lane);
      });
    })(mBtns[i]);
  }

  function hitLane(lane) {
    if (!state.running) return;

    // Visual feedback on lane hint
    const hint = laneHints[lane];
    hint.classList.add('hit');
    setTimeout(function(){ hint.classList.remove('hit'); }, 80);

    const now = performance.now();
    const elapsed = now - state.startTime;

    // Find closest un-hit note in this lane
    let closest = null;
    let closestDiff = Infinity;
    for (let i = 0; i < state.activeNotes.length; i++) {
      const n = state.activeNotes[i];
      if (n.lane !== lane || n.hit || n.missed || !n.el) continue;
      const diff = Math.abs(elapsed - n.hitTime);
      if (diff < closestDiff) {
        closestDiff = diff;
        closest = n;
      }
    }

    if (!closest || closestDiff > OK_MS) {
      // Empty press
      if (state.combo > 3) {
        state.combo = Math.floor(state.combo * 0.7);
        updateHUD();
      }
      return;
    }

    // Judge
    let judge, points, color;
    if (closestDiff <= PERFECT_MS) {
      judge = 'PERFECT!';
      points = 300;
      color = '#ffeb3b';
      state.perfect++;
      sfxPerfect();
    } else if (closestDiff <= GOOD_MS) {
      judge = 'GREAT!';
      points = 150;
      color = '#4caf50';
      state.good++;
      sfxHit();
    } else {
      judge = 'GOOD';
      points = 75;
      color = '#00e5ff';
      state.ok++;
      sfxHit();
    }

    closest.hit = true;
    state.combo++;
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;
    const mult = 1 + Math.floor(state.combo / 10) * 0.5;
    state.score += Math.round(points * mult);

    // Visual effects at note position
    const rect = closest.el.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const x = rect.left - stageRect.left + rect.width / 2;
    const y = rect.top - stageRect.top + rect.height / 2;

    createSpark(x, y, color);
    createPopup(x, y - 30, judge, color);

    // Remove note
    closest.el.remove();
    closest.el = null;

    // Combo popup
    if (state.combo > 0 && state.combo % 10 === 0) {
      sfxCombo();
      showComboBig(state.combo + 'x COMBO!');
    }

    updateHUD();
  }

  function handleMiss(n) {
    if (n.el) {
      const rect = n.el.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      const x = rect.left - stageRect.left + rect.width / 2;
      const y = rect.top - stageRect.top + rect.height / 2;
      createPopup(x, y, 'MISS', '#ff1744');
      n.el.style.opacity = '0.3';
      (function(el){ setTimeout(function(){ el.remove(); }, 300); })(n.el);
      n.el = null;
    }
    state.miss++;
    state.combo = 0;
    sfxMiss();
    updateHUD();
  }

  // ============ VISUALS ============
  function createSpark(x, y, color) {
    const el = document.createElement('div');
    el.className = 'spark';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.background = 'radial-gradient(circle, ' + color + ', transparent 70%)';
    stage.appendChild(el);
    setTimeout(function(){ el.remove(); }, 500);
  }

  function createPopup(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'popup';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    el.textContent = text;
    el.style.fontSize = text.length > 6 ? '14px' : '20px';
    stage.appendChild(el);
    setTimeout(function(){ el.remove(); }, 700);
  }

  function showComboBig(text) {
    comboBig.textContent = text;
    comboBig.classList.remove('show');
    void comboBig.offsetWidth;
    comboBig.classList.add('show');
  }

  function updateHUD() {
    scorePill.textContent = '🏆 ' + state.score;
    comboPill.textContent = '🔥 ' + state.combo;
  }

  // ============ END SONG ============
  function endSong() {
    state.running = false;
    stopMusic();
    if (state.animId) cancelAnimationFrame(state.animId);

    // Cleanup notes
    document.querySelectorAll('.note').forEach(function(n){ n.remove(); });
    state.activeNotes = [];

    const totalHit = state.perfect + state.good + state.ok;
    const totalAttempt = totalHit + state.miss;
    const acc = totalAttempt > 0 ? Math.round((totalHit / totalAttempt) * 100) : 0;

    let rank = '🥉';
    let rankText = 'Achha try! Aur practice karo!';
    if (acc >= 95 && state.miss <= 2) {
      rank = '🏆';
      rankText = 'LEGENDARY DJ! Tum toh coding ke Ustad ho! 🔥';
    } else if (acc >= 85) {
      rank = '🥇';
      rankText = 'Amazing! Code perfectly compile! 🎉';
    } else if (acc >= 70) {
      rank = '🥈';
      rankText = 'Great! Thoda aur practice!';
    }

    document.getElementById('endTitle').textContent = SONGS[state.songIdx % SONGS.length].name + ' Complete!';
    document.getElementById('rankEmoji').textContent = rank;
    document.getElementById('finalScore').textContent = state.score;
    document.getElementById('finalCombo').textContent = state.maxCombo;
    document.getElementById('finalAcc').textContent = acc + '%';
    document.getElementById('rankText').textContent = rankText;

    endScreen.classList.remove('hide');

    // Advance song for next round
    state.songIdx = (state.songIdx + 1) % SONGS.length;

    // Play victory jingle
    setTimeout(function() {
      playTone(523, 0.15, 'sine', 0.18);
      setTimeout(function(){ playTone(659, 0.15, 'sine', 0.18); }, 150);
      setTimeout(function(){ playTone(784, 0.15, 'sine', 0.18); }, 300);
      setTimeout(function(){ playTone(1047, 0.5, 'sine', 0.2); }, 450);
    }, 200);
  }

  // ============ INIT ============
  positionStatic();
  window.addEventListener('resize', positionStatic);

  document.getElementById('playBtn').addEventListener('click', startGame);
  document.getElementById('playAgainBtn').addEventListener('click', startGame);

  // Resume audio on first interaction
  function firstTouch() {
    initAudio();
    document.removeEventListener('touchstart', firstTouch);
    document.removeEventListener('click', firstTouch);
  }
  document.addEventListener('touchstart', firstTouch, { passive: true });
  document.addEventListener('click', firstTouch);

  // Prevent scroll on stage
  stage.addEventListener('touchmove', function(e) {
    e.preventDefault();
  }, { passive: false });

})();
</script>
</body>
