
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeShalaByKMFL | Authentication</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #090d18;
    color: white;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: #121a2a;
    padding: 35px;
    border: 1px solid #28334a;
    border-radius: 18px;
    box-shadow: 0 15px 50px #0008;
}

.logo {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    color: #ffb86b;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aab3c5;
    margin-bottom: 28px;
    font-size: 14px;
}

h2 {
    margin-bottom: 22px;
    font-size: 23px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    border: 1px solid #344159;
    border-radius: 9px;
    outline: none;
    background: #0b1220;
    color: white;
    font-size: 14px;
}

input:focus {
    border-color: #ffb86b;
}

button {
    width: 100%;
    padding: 14px;
    background: #ffb86b;
    color: #151515;
    font-weight: bold;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-size: 15px;
    margin-top: 5px;
}

button:hover {
    background: #ffa94d;
}

.switch {
    text-align: center;
    margin-top: 22px;
    color: #aab3c5;
    font-size: 14px;
}

.switch span, .forgot {
    color: #ffb86b;
    cursor: pointer;
}

.forgot {
    display: block;
    text-align: right;
    font-size: 13px;
    margin: -5px 0 15px;
}

#message {
    margin-top: 15px;
    text-align: center;
    font-size: 13px;
    color: #ff7777;
    overflow-wrap: anywhere;
}

.hidden {
    display: none !important;
}

.dashboard {
    text-align: center;
}

.dashboard h2 {
    color: #ffb86b;
    margin-bottom: 15px;
}

.dashboard p {
    color: #bdc5d4;
    margin-bottom: 25px;
    overflow-wrap: anywhere;
}

.logout {
    background: #ff6565;
    color: white;
}

.footer {
    text-align: center;
    color: #667085;
    font-size: 11px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">CodeShalaByKMFL</div>
    <div class="subtitle">Learn. Build. Create.</div>

    <!-- LOGIN -->
    <div id="loginBox">

        <h2>Welcome Back 👋</h2>

        <form id="loginForm">
            <input type="email" id="loginEmail"
                placeholder="Email Address" required>

            <input type="password" id="loginPassword"
                placeholder="Password" required>

            <span class="forgot" id="forgotPassword">
                Forgot Password?
            </span>

            <button type="submit">Login</button>
        </form>

        <div class="switch">
            Don't have an account?
            <span id="showSignup">Sign Up</span>
        </div>

    </div>

    <!-- SIGNUP -->
    <div id="signupBox" class="hidden">

        <h2>Create Account 🚀</h2>

        <form id="signupForm">

            <input type="text" id="signupName"
                placeholder="Full Name" maxlength="60" required>

            <input type="email" id="signupEmail"
                placeholder="Email Address" required>

            <input type="password" id="signupPassword"
                placeholder="Create Password" minlength="6" required>

            <input type="password" id="confirmPassword"
                placeholder="Confirm Password" minlength="6" required>

            <button type="submit">Create Account</button>

        </form>

        <div class="switch">
            Already have an account?
            <span id="showLogin">Login</span>
        </div>

    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard hidden">

        <h2>Welcome! 🎉</h2>

        <p id="userName"></p>
        <p id="userEmail"></p>

        <button class="logout" id="logoutBtn">
            Logout
        </button>

    </div>

    <div id="message"></div>

    <div class="footer">
        © 2026 CodeShalaByKMFL. All Rights Reserved.
    </div>

</div>


<script type="module">

// FIREBASE IMPORTS

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged,
    signOut,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// FIREBASE CONFIG

const firebaseConfig = {
    apiKey: "AIzaSyCuuUwd7TINIAwlLxg-OYjo7Q-1cBsbU5I",
    authDomain: "codeshalatest.firebaseapp.com",
    databaseURL: "https://codeshalatest-default-rtdb.firebaseio.com",
    projectId: "codeshalatest",
    storageBucket: "codeshalatest.firebasestorage.app",
    messagingSenderId: "63047132068",
    appId: "1:63047132068:web:b5eb1269a25ea412ed5731"
};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);


// ELEMENTS

const loginBox = document.getElementById("loginBox");
const signupBox = document.getElementById("signupBox");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");


// MESSAGE FUNCTION

function showMessage(text, success = false) {
    message.style.color = success ? "#6ee7a0" : "#ff7777";
    message.textContent = text;
}


// SWITCH LOGIN / SIGNUP

document.getElementById("showSignup").onclick = () => {
    loginBox.classList.add("hidden");
    signupBox.classList.remove("hidden");
    message.textContent = "";
};

document.getElementById("showLogin").onclick = () => {
    signupBox.classList.add("hidden");
    loginBox.classList.remove("hidden");
    message.textContent = "";
};


// SIGNUP

document.getElementById("signupForm").addEventListener("submit", async (e) => {

    e.preventDefault();

    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (password !== confirm) {
        showMessage("Passwords do not match!");
        return;
    }

    try {

        showMessage("Creating your account...", true);

        const result = await createUserWithEmailAndPassword(
            auth, email, password
        );

        const user = result.user;

        await updateProfile(user, {
            displayName: name
        });

        // SAVE PROFILE IN REALTIME DATABASE

        try {
            await set(ref(database, "users/" + user.uid), {
                name: name,
                email: user.email,
                uid: user.uid,
                createdAt: new Date().toISOString()
            });
        } catch (dbError) {
            console.error("Profile save error:", dbError);
            showMessage(
                "Account created! Profile could not be saved. Check Database Rules."
            );
            return;
        }

        showMessage("Account created successfully!", true);

    } catch (error) {
        showMessage(error.message);
    }

});


// LOGIN

document.getElementById("loginForm").addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {

        showMessage("Logging in...", true);

        await signInWithEmailAndPassword(auth, email, password);

        showMessage("Login successful!", true);

    } catch (error) {
        showMessage(error.message);
    }

});


// FORGOT PASSWORD

document.getElementById("forgotPassword").onclick = async () => {

    const email = document.getElementById("loginEmail").value.trim();

    if (!email) {
        showMessage("Please enter your email first.");
        return;
    }

    try {

        await sendPasswordResetEmail(auth, email);

        showMessage("Password reset email sent!", true);

    } catch (error) {
        showMessage(error.message);
    }

};


// AUTH STATE LISTENER

onAuthStateChanged(auth, (user) => {

    message.textContent = "";

    if (user) {

        loginBox.classList.add("hidden");
        signupBox.classList.add("hidden");
        dashboard.classList.remove("hidden");

        document.getElementById("userName").textContent =
            "Name: " + (user.displayName || "User");

        document.getElementById("userEmail").textContent =
            "Email: " + user.email;

    } else {

        dashboard.classList.add("hidden");
        loginBox.classList.remove("hidden");
        signupBox.classList.add("hidden");

    }

});


// LOGOUT

document.getElementById("logoutBtn").onclick = async () => {

    try {
        await signOut(auth);
        showMessage("Logged out successfully!", true);
    } catch (error) {
        showMessage(error.message);
    }

};

</script>

</body>
</html>
